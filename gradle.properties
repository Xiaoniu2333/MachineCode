# MachineCode build properties
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false

group=com.Xiaoniu2333.mlky
version=1.0.0

# Minecraft / Fabric
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
fabric_loader_version=0.19.5
fabric_api_version=0.141.6+1.21.11
# 1.17.21 is the last Java-21-compatible Loom line. 1.18+ requires Java 25 at build time.
loom_version=1.17.21

# Server
paper_api_version=1.21.11-R0.1-SNAPSHOT
# Velocity 4.2.0 is built for Java 25. The plugin is compiled against that exact API
# (using a JDK 25 compiler in this module) but emitted as Java 21 bytecode.
velocity_api_version=4.2.0
sqlite_version=3.50.3.0
